# For local credentials run: python -m entry.configure_mimo
llm:
  provider: openai
  model: mimo-v2.6-pro
  api_key: ${MIMO_API_KEY}
  base_url: https://api.xiaomimimo.com/v1
  max_tokens: 8192
agent:
  max_steps: 40
  run_token_limit: 80000
  log_dir: ./logs
context:
  context_window: 32768
  repo_map_budget: 4000
  repo_map_strategy: retrieval
  overview_budget: 1000
  retrieval_result_budget: 1000
  local_map_budget: 1200
  # Require a fresh structured query after this many legacy reads/searches.
  retrieval_refresh_steps: 3
  retrieval_weights: {path: 3.0, symbol: 2.0, text: 1.0, pagerank: 1.0}
  history_window: 20
runtime:
  image: forge-runtime:py311
  # null: install dependencies from repository metadata; []: prebuilt environment
  setup_commands: null
  check_commands:
    - python -m pip check
  setup_network: true
  setup_timeout: 600
memory:
  enabled: true
  # Empty uses %LOCALAPPDATA%/Forge/memory on Windows or XDG_STATE_HOME on Linux.
  path: ""
  initial_token_budget: 600
  search_token_budget: 800
  max_results: 5
  retention_days: 180
  busy_timeout_ms: 5000
  auto_resume_chat: true
  weights: {lexical: 3.0, fingerprint: 2.5, path: 2.0, symbol: 1.5, validation: 1.5, confidence: 1.0, recency: 0.5, stale: 1.5, repeat: 2.0}
