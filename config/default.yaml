# For local credentials run: python -m entry.configure_mimo
llm:
  provider: openai
  model: mimo-v2.6-pro
  api_key: ${MIMO_API_KEY}
  base_url: https://api.xiaomimimo.com/v1
  max_tokens: 8192
agent:
  max_steps: 40
  budget_tokens: 80000
  log_dir: ./logs
context:
  repo_map_budget: 8000
  history_window: 20
